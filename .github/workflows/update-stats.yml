name: Update CP Stats

on:
  schedule:
    # Run daily at 00:15 UTC (offset to avoid peak load)
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      fetch_only:
        description: 'Only fetch data, skip generation'
        required: false
        default: 'false'

concurrency:
  group: update-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Fetch & Generate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Codeforces
        id: cf
        continue-on-error: true
        run: node -e "import('./scripts/fetch-cf.js').then(m => m.fetchCF())"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch LeetCode
        id: lc
        continue-on-error: true
        run: node -e "import('./scripts/fetch-lc.js').then(m => m.fetchLC())"

      - name: Fetch AtCoder
        id: ac
        continue-on-error: true
        run: node -e "import('./scripts/fetch-ac.js').then(m => m.fetchAC())"

      - name: Fetch GitHub
        id: gh
        continue-on-error: true
        run: node -e "import('./scripts/fetch-gh.js').then(m => m.fetchGH())"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log fetch results
        run: |
          echo "CF: ${{ steps.cf.outcome }}"
          echo "LC: ${{ steps.lc.outcome }}"
          echo "AC: ${{ steps.ac.outcome }}"
          echo "GH: ${{ steps.gh.outcome }}"

      - name: Generate assets
        if: ${{ github.event.inputs.fetch_only != 'true' }}
        run: node scripts/build-all.js --generate-only

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet assets/ data/cache/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated assets
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ data/cache/
          git commit -m "chore: update CP stats [$(date -u +%Y-%m-%d)]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes
        if: steps.changes.outputs.changed != 'true'
        run: echo "No changes to commit."

      - name: Upload cache as artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-cache-${{ github.run_id }}
          path: data/cache/
          retention-days: 7
