<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200"
     width="600" height="200" role="img" aria-label="AtCoder rating history">
  <title>AtCoder — Rating History</title>
  <defs>
    <linearGradient id="areaGrad_ac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00C0C0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00C0C0" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow_ac">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip_ac">
      <rect x="60" y="30" width="520" height="130"/>
    </clipPath>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .draw-anim { stroke-dashoffset: 0 !important; }
        .pulse { animation: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="8" fill="#161b22"/>
  <rect x="1" y="1" width="598" height="198" rx="7" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="60" y="20" font-family="'Courier New',Courier,monospace" font-size="12"
        fill="#e6edf3" font-weight="bold" letter-spacing="1">ATCODER</text>
  <text x="580" y="20" text-anchor="end" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#00C0C0" font-weight="bold">
    Om_patel07 · 1207
  </text>

  <!-- Grid lines -->
  
  <line x1="60" y1="160.0" x2="580" y2="160.0"
        stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="54" y="164.0" text-anchor="end"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">-47</text>
  
  <line x1="60" y1="95.0" x2="580" y2="95.0"
        stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="54" y="99.0" text-anchor="end"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">630</text>
  
  <line x1="60" y1="30.0" x2="580" y2="30.0"
        stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="54" y="34.0" text-anchor="end"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">1307</text>
  

  <!-- Area fill -->
  <polygon points="60.0,160 60.0,155.2 87.4,154.7 114.7,147.7 142.1,142.5 169.5,126.2 196.8,105.8 224.2,102.5 251.6,91.4 278.9,87.6 306.3,73.4 333.7,73.4 361.1,73.4 388.4,66.9 415.8,62.7 443.2,62.7 470.5,59.2 497.9,56.6 525.3,56.6 552.6,50.5 580.0,39.6 580.0,160" fill="url(#areaGrad_ac)" clip-path="url(#clip_ac)"/>

  <!-- Rating line — animated draw -->
  <polyline points="60.0,155.2 87.4,154.7 114.7,147.7 142.1,142.5 169.5,126.2 196.8,105.8 224.2,102.5 251.6,91.4 278.9,87.6 306.3,73.4 333.7,73.4 361.1,73.4 388.4,66.9 415.8,62.7 443.2,62.7 470.5,59.2 497.9,56.6 525.3,56.6 552.6,50.5 580.0,39.6" fill="none" stroke="#00C0C0" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"
            clip-path="url(#clip_ac)"
            stroke-dasharray="300" stroke-dashoffset="300">
    <animate attributeName="stroke-dashoffset" from="300" to="0"
             dur="1.5s" calcMode="ease" fill="freeze"/>
  </polyline>

  <!-- Latest rating dot with pulse -->
  <circle cx="580.0" cy="39.6" r="5" fill="#00C0C0"
          filter="url(#glow_ac)">
    <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580.0" cy="39.6" r="3" fill="#ffffff"/>

  <!-- X-axis date labels (first and last) -->
  <text x="60" y="175" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">
    2025-10
  </text>
  <text x="580" y="175" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">
    2026-10
  </text>

  <!-- Axes -->
  <line x1="60" y1="30" x2="60" y2="160"
        stroke="#30363d" stroke-width="1"/>
  <line x1="60" y1="160" x2="580" y2="160"
        stroke="#30363d" stroke-width="1"/>
</svg>