<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320"
     width="1200" height="320" role="img" aria-label="Tech stack constellation">
  <title>Tech Stack — Om Patel</title>
  <defs>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .orbit-planet { animation: none !important; }
        animateTransform { display: none; }
      }
    </style></defs>
  <rect width="1200" height="320" fill="#0d1117"/>
  
  <text x="600" y="20" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="12"
        fill="#8b949e" letter-spacing="4">LANGUAGES ALLOWED · TECH STACK</text>
  
  <circle cx="600" cy="160" r="70" fill="none" stroke="#ff0080"
          stroke-width="0.5" stroke-dasharray="4,8" opacity="0.3"/>
  <circle cx="600" cy="160" r="130" fill="none" stroke="#7928ca"
          stroke-width="0.5" stroke-dasharray="4,8" opacity="0.3"/>
  <circle cx="600" cy="160" r="180" fill="none" stroke="#00dfd8"
          stroke-width="0.5" stroke-dasharray="4,8" opacity="0.3"/>
  <circle cx="600" cy="160" r="230" fill="none" stroke="#39d353"
          stroke-width="0.5" stroke-dasharray="4,8" opacity="0.3"/>
  
  <!-- Center: C++ sun -->
  <circle cx="600" cy="160" r="28" fill="#161b22" stroke="#ff0080" stroke-width="2"
          filter="url(#glow)">
    <animate attributeName="stroke-width" values="2;3;2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="165" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="14" font-weight="bold"
        fill="#ff0080">C++</text>
  <!-- Pulse ring -->
  <circle cx="600" cy="160" r="28" fill="none" stroke="#ff0080" stroke-width="1" opacity="0.5">
