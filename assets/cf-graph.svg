<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200"
     width="600" height="200" role="img" aria-label="Codeforces rating history">
  <title>Codeforces — Rating History</title>
  <defs>
    <linearGradient id="areaGrad_cf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03a89e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#03a89e" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow_cf">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip_cf">
      <rect x="60" y="30" width="520" height="130"/>
    </clipPath>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .draw-anim { stroke-dashoffset: 0 !important; }
        .pulse { animation: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="8" fill="#161b22"/>
  <rect x="1" y="1" width="598" height="198" rx="7" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="60" y="20" font-family="'Courier New',Courier,monospace" font-size="12"
        fill="#e6edf3" font-weight="bold" letter-spacing="1">CODEFORCES</text>
  <text x="580" y="20" text-anchor="end" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#03a89e" font-weight="bold">
    Omm_Patel · 1440
  </text>

  <!-- Grid lines -->
  
  <line x1="60" y1="160.0" x2="580" y2="160.0"
        stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="54" y="164.0" text-anchor="end"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">326</text>
  
  <line x1="60" y1="95.0" x2="580" y2="95.0"
        stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="54" y="99.0" text-anchor="end"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">1033</text>
  
  <line x1="60" y1="30.0" x2="580" y2="30.0"
        stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="54" y="34.0" text-anchor="end"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">1740</text>
  

  <!-- Area fill -->
  <polygon points="60.0,160 60.0,155.4 72.1,134.8 84.2,121.1 96.3,107.0 108.4,96.1 120.5,87.6 132.6,82.2 144.7,83.6 156.7,83.9 168.8,77.9 180.9,81.8 193.0,78.5 205.1,68.3 217.2,72.8 229.3,74.5 241.4,69.3 253.5,65.7 265.6,57.9 277.7,60.9 289.8,62.4 301.9,57.9 314.0,60.0 326.0,53.0 338.1,51.2 350.2,46.4 362.3,52.7 374.4,45.5 386.5,49.7 398.6,47.7 410.7,46.8 422.8,44.4 434.9,39.2 447.0,45.4 459.1,45.7 471.2,48.9 483.3,50.4 495.3,51.0 507.4,55.1 519.5,56.6 531.6,56.6 543.7,59.7 555.8,45.5 567.9,49.1 580.0,57.6 580.0,160" fill="url(#areaGrad_cf)" clip-path="url(#clip_cf)"/>

  <!-- Rating line — animated draw -->
  <polyline points="60.0,155.4 72.1,134.8 84.2,121.1 96.3,107.0 108.4,96.1 120.5,87.6 132.6,82.2 144.7,83.6 156.7,83.9 168.8,77.9 180.9,81.8 193.0,78.5 205.1,68.3 217.2,72.8 229.3,74.5 241.4,69.3 253.5,65.7 265.6,57.9 277.7,60.9 289.8,62.4 301.9,57.9 314.0,60.0 326.0,53.0 338.1,51.2 350.2,46.4 362.3,52.7 374.4,45.5 386.5,49.7 398.6,47.7 410.7,46.8 422.8,44.4 434.9,39.2 447.0,45.4 459.1,45.7 471.2,48.9 483.3,50.4 495.3,51.0 507.4,55.1 519.5,56.6 531.6,56.6 543.7,59.7 555.8,45.5 567.9,49.1 580.0,57.6" fill="none" stroke="#03a89e" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"
            clip-path="url(#clip_cf)"
            stroke-dasharray="660" stroke-dashoffset="660">
    <animate attributeName="stroke-dashoffset" from="660" to="0"
             dur="1.5s" calcMode="ease" fill="freeze"/>
  </polyline>

  <!-- Latest rating dot with pulse -->
  <circle cx="580.0" cy="57.6" r="5" fill="#03a89e"
          filter="url(#glow_cf)">
    <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580.0" cy="57.6" r="3" fill="#ffffff"/>

  <!-- X-axis date labels (first and last) -->
  <text x="60" y="175" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">
    2025-03
  </text>
  <text x="580" y="175" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">
    2026-09
  </text>

  <!-- Axes -->
  <line x1="60" y1="30" x2="60" y2="160"
        stroke="#30363d" stroke-width="1"/>
  <line x1="60" y1="160" x2="580" y2="160"
        stroke="#30363d" stroke-width="1"/>
</svg>