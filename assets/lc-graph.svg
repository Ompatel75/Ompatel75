<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200"
     width="600" height="200" role="img" aria-label="LeetCode Contest rating history">
  <title>LeetCode Contest — Rating History</title>
  <defs>
    <linearGradient id="areaGrad_lc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow_lc">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip_lc">
      <rect x="60" y="30" width="520" height="130"/>
    </clipPath>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .draw-anim { stroke-dashoffset: 0 !important; }
        .pulse { animation: none; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="8" fill="#161b22"/>
  <rect x="1" y="1" width="598" height="198" rx="7" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="60" y="20" font-family="'Courier New',Courier,monospace" font-size="12"
        fill="#e6edf3" font-weight="bold" letter-spacing="1">LEETCODE CONTEST</text>
  <text x="580" y="20" text-anchor="end" font-family="'Courier New',Courier,monospace"
        font-size="11" fill="#ff0080" font-weight="bold">
    om_patel11 · 2051
  </text>

  <!-- Grid lines -->
  
  <line x1="60" y1="160.0" x2="580" y2="160.0"
        stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="54" y="164.0" text-anchor="end"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">1554</text>
  
  <line x1="60" y1="94.9" x2="580" y2="94.9"
        stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="54" y="98.9" text-anchor="end"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">1853</text>
  
  <line x1="60" y1="30.0" x2="580" y2="30.0"
        stroke="#30363d" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="54" y="34.0" text-anchor="end"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">2151</text>
  

  <!-- Area fill -->
  <polygon points="60.0,160 60.0,146.5 90.6,149.1 121.2,137.6 151.8,130.8 182.4,127.3 212.9,119.9 243.5,106.2 274.1,104.9 304.7,101.6 335.3,96.6 365.9,91.2 396.5,86.6 427.1,81.0 457.6,80.5 488.2,73.8 518.8,62.0 549.4,58.3 580.0,51.8 580.0,160" fill="url(#areaGrad_lc)" clip-path="url(#clip_lc)"/>

  <!-- Rating line — animated draw -->
  <polyline points="60.0,146.5 90.6,149.1 121.2,137.6 151.8,130.8 182.4,127.3 212.9,119.9 243.5,106.2 274.1,104.9 304.7,101.6 335.3,96.6 365.9,91.2 396.5,86.6 427.1,81.0 457.6,80.5 488.2,73.8 518.8,62.0 549.4,58.3 580.0,51.8" fill="none" stroke="#ff0080" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"
            clip-path="url(#clip_lc)"
            stroke-dasharray="270" stroke-dashoffset="270">
    <animate attributeName="stroke-dashoffset" from="270" to="0"
             dur="1.5s" calcMode="ease" fill="freeze"/>
  </polyline>

  <!-- Latest rating dot with pulse -->
  <circle cx="580.0" cy="51.8" r="5" fill="#ff0080"
          filter="url(#glow_lc)">
    <animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.6;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580.0" cy="51.8" r="3" fill="#ffffff"/>

  <!-- X-axis date labels (first and last) -->
  <text x="60" y="175" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">
    2025-10
  </text>
  <text x="580" y="175" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#8b949e">
    2026-10
  </text>

  <!-- Axes -->
  <line x1="60" y1="30" x2="60" y2="160"
        stroke="#30363d" stroke-width="1"/>
  <line x1="60" y1="160" x2="580" y2="160"
        stroke="#30363d" stroke-width="1"/>
</svg>